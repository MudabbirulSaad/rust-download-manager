[workspace]
members = ["crates/protocol", "crates/core", "crates/backend", "src-tauri"]
default-members = ["crates/protocol", "crates/core", "crates/backend"]
resolver = "2"

[workspace.package]
version = "0.2.2"
edition = "2024"
license = "GPL-3.0-only"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4", "serde"] }
rdm-protocol = { path = "crates/protocol" }
rdm-core = { path = "crates/core" }

[profile.release]
strip = true
lto = "thin"
