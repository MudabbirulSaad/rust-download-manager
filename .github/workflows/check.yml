name: Ubuntu build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: rdm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ubuntu:
    name: agent-and-package-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: Prepare pinned Ubuntu build and test environment
        run: bash scripts/agent-setup.sh --system --drivers
      - name: Verify source, desktop and installed Ubuntu 24.04 / 26.04 packages
        run: npm run agent:check -- --profiles common,http,media,desktop,package --environment ci --allow-external --base origin/main
        # Local browser/portal checks remain explicit external evidence requirements.
        # This option does not turn them into passing results in the evidence report.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rdm-ubuntu-amd64
          include-hidden-files: true
          path: |
            dist/*.deb
            dist/*.zip
            dist/SHA256SUMS
            dist/*source.tar.gz
            .agent-runs/**/checks.json
            .agent-runs/**/*.log
            .agent-runs/**/*.png
