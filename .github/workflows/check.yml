name: Ubuntu build
on: [push, pull_request, workflow_dispatch]
jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf webkit2gtk-driver xvfb xauth dbus-x11
      - run: sudo apt-get install -y ffmpeg && npm run release
      - run: cargo install tauri-driver --version 2.1.0 --locked --root .cache/driver
      - run: dbus-run-session -- xvfb-run -a python3 tests/desktop_webdriver.py
        env:
          RDM_DESKTOP: ${{ github.workspace }}/target/release/rdm
          RDM_TEST_BACKEND: ${{ github.workspace }}/target/release/rdm-backend
      - uses: actions/upload-artifact@v4
        with:
          name: rdm-ubuntu-amd64
          path: |
            dist/*.deb
            dist/*.zip
            dist/SHA256SUMS
            dist/*source.tar.gz
            dist/screenshots/*.png
